<!--
  ============================================================
  WordPress FSE Template: "page" (hostinger-ai-theme)
  ============================================================
  This is the template that renders ALL pages on vantly.co.za,
  including /insights/.

  Structure:
    1. Header template part (see header-template-part.html)
    2. Page title (centered h1 — we hide this with CSS)
    3. Post content (this is where our custom HTML lives)
    4. Footer template part (see footer-template-part.html)

  The key constraint: wp:post-content uses layout type "constrained"
  which caps content width at 700px (content-size) / 1100px (wide-size).
  Our CSS overrides must break out of this.
  ============================================================
-->

<!-- wp:template-part {"slug":"header","theme":"hostinger-ai-theme","tagName":"header","className":"site-header"} /-->

<!-- wp:group {"tagName":"main","style":{"spacing":{"padding":{"top":"0","bottom":"0"}}},"layout":{"type":"default"}} -->
<main class="wp-block-group" style="padding-top:0;padding-bottom:0">

    <!-- wp:group {"align":"full","style":{"spacing":{"padding":{"top":"0","bottom":"0"}}},"layout":{"type":"constrained"}} -->
    <div class="wp-block-group alignfull" style="padding-top:0;padding-bottom:0">

        <!-- wp:post-title {"textAlign":"center","level":1,"className":"hostinger-ai-page-title","style":{"spacing":{"padding":{"top":"var:preset|spacing|60","bottom":"var:preset|spacing|60"}}},"fontSize":"x-large"} /-->

    </div>
    <!-- /wp:group -->

    <!--
        ⚠️ THIS IS THE KEY BLOCK — "constrained" layout
        WordPress wraps our page content in:
          <div class="entry-content wp-block-post-content has-global-padding is-layout-constrained">
        
        This sets max-width: 700px on content.
        Our CSS must override with: max-width: none !important;
    -->
    <!-- wp:post-content {"layout":{"type":"constrained"}} /-->

</main>
<!-- /wp:group -->
