name: CI

# The desktop app loads its pages from this deployment on next open, so a broken push reaches
# every user without anyone installing anything. Both checks already existed and both already
# passed locally — neither ran automatically, which is why the bugs they catch reached the list.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Static: every API file and every page parses, tags balance, volt-auth survives the sync.
      - name: Static checks
        run: node smoke.cjs

      # Pinned: an unpinned "playwright@1" meant a new browser build could change render results (or
      # break the job) on a day nothing in this repo changed, and there is no lockfile to catch it.
      - name: Install Playwright (chromium only)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      # Renders every design AND every copy-library line (about 2,600) through the production worker
      # and asserts on the draw trace. Fails the build if Playwright is missing (CI=true).
      - name: Render checks
        run: node ci-render.cjs

      # Real-browser checks of the sign-in behaviour and the sandboxed email preview.
      - name: Browser tests
        run: node tests/browser.test.cjs
